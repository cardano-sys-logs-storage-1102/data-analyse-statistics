sform: none !important; }\n\n.actions {\n  display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 0;\n}\n\n/* ════════════ INSIGHTS ════════════ */\n.insight-list { display: flex; flex-direction: column; gap: 8px; }\n.insight-item {\n  background: var(--bg-card); border: 1px solid var(--border);\n  border-left: 3px solid var(--accent);\n  border-radius: var(--radius-md);\n  padding: 12px 16px;\n  display: flex; align-items: flex-start; gap: 10px;\n  animation: fadeIn 0.3s var(--ease);\n}\n.insight-item.warn { border-left-color: var(--red); }\n.insight-item.ok { border-left-color: var(--green); }\n.insight-item.info { border-left-color: var(--blue); }\n.insight-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }\n.insight-text { flex: 1; font-size: 0.82rem; color: var(--text-body); line-height: 1.55; }\n.insight-text b { color: var(--text-bright); font-family: var(--font-mono); font-weight: 600; }\n\n/* ════════════ EXPANDERS (\"como interpretar\") ════════════ */\n.expander {\n  background: var(--bg-card);\n  border: 1px dashed var(--border-strong);\n  border-radius: var(--radius-md);\n  margin-top: 12px;\n  overflow: hidden;\n}\n.expander-head {\n  padding: 10px 14px;\n  cursor: pointer;\n  font-family: var(--font-mono); font-size: 0.68rem;\n  color: var(--accent); letter-spacing: 0.06em;\n  display: flex; align-items: center; gap: 8px;\n}\n.expander-head::before {\n  content: '▸'; font-size: 0.65rem;\n  transition: transform 0.2s var(--ease);\n}\n.expander.open .expander-head::before { transform: rotate(90deg); }\n.expander-body {\n  display: none; padding: 0 14px 14px;\n  font-size: 0.8rem; color: var(--text-body);\n  line-height: 1.6;\n}\n.expander.open .expander-body { display: block; }\n.expander-body b { color: var(--accent); font-family: var(--font-mono); }\n.expander-body .kv {\n  background: var(--bg-elev); border: 1px solid var(--border);\n  padding: 8px 12px; border-radius: var(--radius-sm);\n  margin-top: 8px; font-family: var(--font-mono); font-size: 0.74rem;\n}\n\n/* ════════════ CHART ════════════ */\n.chart-wrap { height: 380px; position: relative; }\n.chart-wrap.tall { height: 460px; }\n.chart-wrap.short { height: 260px; }\n.chart-row {\n  display: grid; gap: 16px;\n  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));\n  margin-bottom: 18px;\n}\n\n/* Slider */\n.slider-row {\n  display: flex; align-items: center; gap: 14px;\n  margin-bottom: 12px;\n  font-family: var(--font-mono); font-size: 0.72rem;\n  color: var(--text-muted);\n}\n.slider-row input[type=range] { flex: 1; accent-color: var(--accent); }\n.slider-row .val {\n  color: var(--accent); font-weight: 600; min-width: 40px; text-align: right;\n}\n\n/* Verdict badge */\n.verdict {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 6px 12px;\n  border-radius: var(--radius-sm);\n  font-family: var(--font-mono); font-size: 0.76rem;\n  font-weight: 600; letter-spacing: 0.04em;\n}\n.verdict.ok { background: rgba(52,211,153,0.12); color: var(--green); border: 1px solid rgba(52,211,153,0.3); }\n.verdict.no { background: rgba(248,113,113,0.12); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }\n\n/* Calculator */\n.tab-group {\n  display: flex; gap: 4px; margin-bottom: 14px;\n  border-bottom: 1px solid var(--border); padding-bottom: 0;\n}\n.tab-btn {\n  background: transparent; border: 1px solid transparent;\n  border-bottom: none;\n  color: var(--text-muted); cursor: pointer;\n  padding: 8px 16px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;\n  font-family: var(--font-mono); font-size: 0.7rem;\n  letter-spacing: 0.06em; text-transform: uppercase;\n  transition: var(--dur) var(--ease);\n  margin-bottom: -1px;\n}\n.tab-btn:hover { color: var(--accent); }\n.tab-btn.active {\n  color: var(--accent); border-color: var(--border);\n  border-bottom-color: var(--bg-card);\n  background: var(--bg-card);\n}\n\n.calc-output {\n  background: var(--bg-elev);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  padding: 16px 18px;\n  margin-top: 14px;\n  font-family: var(--font-mono); font-size: 0.9rem;\n  color: var(--text-bright);\n  min-height: 60px;\n}\n.calc-output .probability {\n  font-size: 1.8rem; color: var(--accent); font-weight: 700;\n  letter-spacing: -0.01em;\n}\n.calc-output .hint { color: var(--text-muted); font-size: 0.72rem; margin-top: 4px; }\n\n/* Extremes list */\n.extremes-grid {\n  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\n}\n.extremes-grid > div {\n  background: var(--bg-card); border: 1px solid var(--border);\n  border-radius: var(--radius-md); padding: 14px 18px;\n}\n.extremes-title {\n  font-family: var(--font-mono); font-size: 0.62rem;\n  color: var(--text-muted); letter-spacing: 0.12em;\n  text-transform: uppercase; margin-bottom: 10px;\n}\n.extremes-list { display: flex; flex-direction: column; gap: 7px; }\n.extremes-item {\n  display: flex; align-items: baseline; gap: 8px;\n  font-family: var(--font-mono);\n}\n.extremes-rank {\n  color: var(--accent); font-size: 0.64rem; width: 20px;\n  font-weight: 600;\n}\n.extremes-val { font-size: 0.9rem; font-weight: 600; color: var(--text-bright); flex: 1; }\n.extremes-where { font-size: 0.62rem; color: var(--text-muted); }\n\n/* Correlation matrix cells */\n.corr-matrix {\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  overflow: auto;\n  background: var(--bg-card);\n}\n.corr-matrix table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.72rem; }\n.corr-matrix th {\n  padding: 8px 10px; text-align: center;\n  background: var(--bg-elev); color: var(--accent);\n  font-size: 0.58rem; letter-spacing: 0.08em;\n  text-transform: uppercase; font-weight: 600;\n  border-bottom: 1px solid var(--border);\n  white-space: nowrap;\n}\n.corr-matrix th.row-label { text-align: left; padding-left: 14px; }\n.corr-matrix td {\n  padding: 10px 12px; text-align: center;\n  border-right: 1px solid var(--border-soft);\n  border-bottom: 1px solid var(--border-soft);\n  font-variant-numeric: tabular-nums;\n  font-weight: 600;\n  position: relative;\n}\n.corr-matrix td.row-label {\n  text-align: left; padding-left: 14px;\n  color: var(--accent); background: var(--bg-elev);\n  font-weight: 600;\n}\n\n/* Comparison table */\n.comp-table {\n  width: 100%; border-collapse: collapse;\n  font-family: var(--font-mono); font-size: 0.78rem;\n}\n.comp-table th, .comp-table td {\n  padding: 10px 14px; text-align: right;\n  border-bottom: 1px solid var(--border);\n}\n.comp-table th:first-child, .comp-table td:first-child { text-align: left; color: var(--text-muted); }\n.comp-table th { color: var(--accent); font-weight: 600; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.08em; }\n.comp-table td { color: var(--text-bright); }\n.comp-table tbody tr:hover { background: var(--bg-hover); }\n\n.comp-kpi-row {\n  display: grid; grid-template-columns: 1fr 1fr;\n  gap: 14px; margin-top: 18px;\n}\n.comp-kpi {\n  background: var(--bg-elev); border: 1px solid var(--border);\n  border-radius: var(--radius-md); padding: 14px 18px;\n}\n.comp-kpi-label {\n  font-family: var(--font-mono); font-size: 0.6rem;\n  color: var(--text-muted); letter-spacing: 0.1em;\n  text-transform: uppercase; margin-bottom: 6px;\n}\n.comp-kpi-val {\n  font-family: var(--font-mono); font-size: 1.6rem;\n  font-weight: 700; letter-spacing: -0.01em;\n}\n.comp-kpi-val.red { color: var(--red); }\n.comp-kpi-val.green { color: var(--green); }\n.comp-kpi-val.accent { color: var(--accent); }\n.comp-kpi-sub { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-muted); margin-top: 4px; }\n\n/* Cluster badge */\n.cluster-dot {\n  display: inline-block; width: 10px; height: 10px;\n  border-radius: 50%; margin-right: 6px;\n}\n\n/* ════════════ EMPTY STATE ════════════ */\n.empty-state {\n  padding: 80px 40px; text-align: center;\n  color: var(--text-muted);\n}\n.empty-state-icon {\n  font-size: 48px; opacity: 0.35;\n  margin-bottom: 16px;\n}\n.empty-state-title {\n  font-family: var(--font-display); font-size: 1.15rem;\n  color: var(--text-body); margin-bottom: 6px;\n}\n.empty-state-sub {\n  font-family: var(--font-mono); font-size: 0.74rem;\n  color: var(--text-muted); letter-spacing: 0.04em;\n}\n\n/* ════════════ CMD PALETTE ════════════ */\n.cmd-palette {\n  display: none; position: fixed; top: 15%; left: 50%;\n  transform: translateX(-50%); width: 90%; max-width: 520px;\n  background: var(--bg-elev);\n  border: 1px solid var(--accent-border);\n  border-radius: var(--radius-lg);\n  box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px var(--accent-faint);\n  z-index: 1100; overflow: hidden;\n  animation: cmdIn 0.2s var(--ease);\n}\n.cmd-palette.open { display: block; }\n@keyframes cmdIn {\n  from { opacity: 0; transform: translate(-50%, -10px); }\n  to { opacity: 1; transform: translate(-50%, 0); }\n}\n.cmd-input {\n  width: 100%; padding: 14px 16px;\n  font-family: var(--font-mono); font-size: 0.88rem;\n  background: transparent; border: none;\n  color: var(--accent); outline: none;\n  border-bottom: 1px solid var(--border);\n}\n.cmd-input::placeholder { color: var(--text-dim); }\n.cmd-list { max-height: 340px; overflow-y: auto; padding: 6px; }\n.cmd-item {\n  padding: 9px 12px;\n  font-family: var(--font-mono); font-size: 0.76rem;\n  color: var(--text-body); cursor: pointer;\n  border-radius: var(--radius-sm);\n  display: flex; justify-content: space-between; align-items: center; gap: 10px;\n}\n.cmd-item:hover, .cmd-item.active {\n  background: var(--accent-faint); color: var(--accent);\n}\n\n/* ════════════ TOAST ════════════ */\n.toast {\n  position: fixed; bottom: 24px; right: 24px;\n  background: var(--bg-elev);\n  border: 1px solid var(--accent-border);\n  border-left: 3px solid var(--accent);\n  color: var(--text-bright);\n  font-family: var(--font-mono); font-size: 0.74rem;\n  padding: 10px 14px; border-radius: var(--radius-sm);\n  z-index: 1200; opacity: 0; pointer-events: none;\n  transform: translateY(10px);\n  transition: all 0.3s var(--ease);\n  box-shadow: 0 8px 24px rgba(0,0,0,0.5);\n}\n.toast.show { opacity: 1; transform: translateY(0); }\n\n/* ════════════ TWEAKS ════════════ */\n.tweaks-panel {\n  position: fixed; right: 16px; bottom: 16px;\n  width: 260px;\n  background: var(--bg-elev);\n  border: 1px solid var(--accent-border);\n  border-radius: var(--radius-md);\n  padding: 14px; z-index: 500;\n  box-shadow: 0 12px 40px rgba(0,0,0,0.6);\n  display: none; font-family: var(--font-mono);\n}\n.tweaks-panel.open { display: block; animation: fadeIn 0.2s var(--ease); }\n.tweaks-title {\n  font-size: 0.66rem; color: var(--accent);\n  letter-spacing: 0.14em; text-transform: uppercase;\n  margin-bottom: 12px;\n  display: flex; justify-content: space-between; align-items: center;\n}\n.tweaks-title button {\n  background: transparent; border: none; color: var(--text-muted);\n  cursor: pointer; font-size: 1rem;\n}\n.tweak-row {\n  display: flex; justify-content: space-between; align-items: center;\n  padding: 8px 0; font-size: 0.66rem;\n  color: var(--text-body);\n  border-bottom: 1px solid var(--border);\n}\n.tweak-row:last-child { border-bottom: none; }\n.tweak-row .opts { display: flex; gap: 4px; }\n.tweak-opt {\n  background: transparent; border: 1px solid var(--border);\n  color: var(--text-muted); cursor: pointer;\n  padding: 3px 8px; border-radius: 3px;\n  font-size: 0.58rem; letter-spacing: 0.06em;\n  font-family: var(--font-mono);\n  transition: 0.15s var(--ease); text-transform: uppercase;\n}\n.tweak-opt:hover { color: var(--accent); border-color: var(--accent-border); }\n.tweak-opt.active {\n  color: var(--accent); border-color: var(--accent);\n  background: var(--accent-faint);\n}\n\n/* ════════════ RESPONSIVE ════════════ */\n@media (max-width: 900px) {\n  :root { --sidebar-w: 64px; }\n  .app { grid-template-columns: var(--sidebar-w) 1fr; }\n  .sb-brand-text, .sb-item-lbl, .sb-item-tag, .sb-file-name, .sb-file-meta, .sb-nav-label { display: none; }\n  .sb-brand, .sb-file { padding: 12px; justify-content: center; }\n  .sb-item { justify-content: center; padding: 10px; }\n  .content-inner { padding: 20px 16px 80px; }\n  .comp-kpi-row, .extremes-grid { grid-template-columns: 1fr; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body data-theme=\"amber\" data-rain=\"on\">\n\n<canvas id=\"matrix-bg\"><\u002Fcanvas>\n\n<div class=\"app\">\n\n  <!-- ═══════════════════ SIDEBAR ═══════════════════ -->\n  <aside class=\"sidebar\">\n    <div class=\"sb-brand\">\n      <div class=\"sb-brand-icon\">Σ<\u002Fdiv>\n      <div class=\"sb-brand-text\">\n        <div class=\"sb-brand-name\">data<span>lab<\u002Fspan><\u002Fdiv>\n        <div class=\"sb-brand-sub\">// análise<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sb-file\" id=\"sbFile\">\n      <span class=\"sb-file-dot\"><\u002Fspan>\n      <div style=\"flex:1; overflow:hidden;\">\n        <div class=\"sb-file-name\" id=\"sbFileName\">nenhum arquivo<\u002Fdiv>\n        <div class=\"sb-file-meta\" id=\"sbFileMeta\">carregue para começar<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav class=\"sb-nav\">\n      <div class=\"sb-nav-label\">dataset<\u002Fdiv>\n      <div class=\"sb-item active\" data-nav=\"upload\"><span class=\"sb-item-num\">00<\u002Fspan><span class=\"sb-item-lbl\">Upload<\u002Fspan><\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"preview\" data-disabled=\"true\"><span class=\"sb-item-num\">01<\u002Fspan><span class=\"sb-item-lbl\">Preview &amp; Filtros<\u002Fspan><\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"quality\" data-disabled=\"true\"><span class=\"sb-item-num\">Q<\u002Fspan><span class=\"sb-item-lbl\">Qualidade<\u002Fspan><span class=\"sb-item-tag\">new<\u002Fspan><\u002Fdiv>\n\n      <div class=\"sb-nav-label\">análise univariada<\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"stats\" data-disabled=\"true\"><span class=\"sb-item-num\">02<\u002Fspan><span class=\"sb-item-lbl\">Descritiva<\u002Fspan><\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"probability\" data-disabled=\"true\"><span class=\"sb-item-num\">03<\u002Fspan><span class=\"sb-item-lbl\">Probabilidade<\u002Fspan><\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"tests\" data-disabled=\"true\"><span class=\"sb-item-num\">04<\u002Fspan><span class=\"sb-item-lbl\">Testes<\u002Fspan><\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"viz\" data-disabled=\"true\"><span class=\"sb-item-num\">05<\u002Fspan><span class=\"sb-item-lbl\">Visualizações<\u002Fspan><\u002Fdiv>\n\n      <div class=\"sb-nav-label\">análise multivariada<\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"compare\" data-disabled=\"true\"><span class=\"sb-item-num\">06<\u002Fspan><span class=\"sb-item-lbl\">Comparar 2 col.<\u002Fspan><\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"correlations\" data-disabled=\"true\"><span class=\"sb-item-num\">07<\u002Fspan><span class=\"sb-item-lbl\">Correlações<\u002Fspan><\u002Fdiv>\n\n      <div class=\"sb-item\" data-nav=\"mreg\" data-disabled=\"true\"><span class=\"sb-item-num\">M<\u002Fspan><span class=\"sb-item-lbl\">Regressão Múltipla<\u002Fspan><span class=\"sb-item-tag\">new<\u002Fspan><\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"contingency\" data-disabled=\"true\"><span class=\"sb-item-num\">×<\u002Fspan><span class=\"sb-item-lbl\">Contingência<\u002Fspan><span class=\"sb-item-tag\">new<\u002Fspan><\u002Fdiv>\n\n      <div class=\"sb-nav-label\">temporal<\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"time\" data-disabled=\"true\"><span class=\"sb-item-num\">T<\u002Fspan><span class=\"sb-item-lbl\">Séries Temporais<\u002Fspan><span class=\"sb-item-tag\">new<\u002Fspan><\u002Fdiv>\n\n      <div class=\"sb-nav-label\">aprendizado<\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"kmeans\" data-disabled=\"true\"><span class=\"sb-item-num\">08<\u002Fspan><span class=\"sb-item-lbl\">K-Means<\u002Fspan><\u002Fdiv>\n      <div class=\"sb-item\" data-nav=\"pca\" data-disabled=\"true\"><span class=\"sb-item-num\">09<\u002Fspan><span class=\"sb-item-lbl\">PCA / SVD<\u002Fspan><\u002Fdiv>\n    <\u002Fnav>\n\n    <div class=\"sb-footer\">\n      <button class=\"sb-footer-btn\" onclick=\"window.history.length&gt;1 ? window.history.back() : (window.location.href='../Matrix Hub.html')\">← hub<\u002Fbutton>\n      <button class=\"sb-footer-btn\" onclick=\"openCmd()\">⌘K<\u002Fbutton>\n      <button class=\"sb-footer-btn\" onclick=\"toggleTweaks()\">⚙<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ═══════════════════ CONTENT ═══════════════════ -->\n  <main class=\"content\">\n    <div class=\"content-inner\">\n\n      <!-- ═════ UPLOAD ═════ -->\n      <section id=\"page-upload\" class=\"page active\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 00 · dataset<\u002Fdiv>\n            <h1 class=\"page-head-title\">Carregar Dados<\u002Fh1>\n            <div class=\"page-head-sub\">Arraste um arquivo ou escolha uma amostra. Formatos suportados: CSV, TSV, JSON, XLSX.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"page-head-right\">ready_<\u002Fdiv>\n        <\u002Fdiv>\n\n        <label class=\"drop-zone\" id=\"dropZone\" for=\"fileInput\" style=\"display:block; cursor:pointer;\">\n          <span class=\"drop-icon\">▤<\u002Fspan>\n          <div class=\"drop-title\">Arraste seu arquivo aqui<\u002Fdiv>\n          <div class=\"drop-sub\">ou clique para selecionar<\u002Fdiv>\n          <div class=\"sample-row\" style=\"justify-content:center;\">\n            <span class=\"format-badge\" style=\"font-family:var(--font-mono); font-size:0.58rem; padding:3px 8px; border:1px solid var(--border-strong); border-radius:3px; color:var(--text-muted);\">CSV<\u002Fspan>\n            <span class=\"format-badge\" style=\"font-family:var(--font-mono); font-size:0.58rem; padding:3px 8px; border:1px solid var(--border-strong); border-radius:3px; color:var(--text-muted);\">TSV<\u002Fspan>\n            <span class=\"format-badge\" style=\"font-family:var(--font-mono); font-size:0.58rem; padding:3px 8px; border:1px solid var(--border-strong); border-radius:3px; color:var(--text-muted);\">JSON<\u002Fspan>\n            <span class=\"format-badge\" style=\"font-family:var(--font-mono); font-size:0.58rem; padding:3px 8px; border:1px solid var(--border-strong); border-radius:3px; color:var(--text-muted);\">XLSX<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Flabel>\n        <input type=\"file\" id=\"fileInput\" accept=\".csv,.tsv,.json,.xlsx,.xls\">\n\n        <div class=\"sample-row\" style=\"margin-top:22px;\">\n          <span class=\"sample-label\">Ou teste com amostras:<\u002Fspan>\n          <button class=\"btn btn-ghost btn-sm\" onclick=\"loadSample('vendas')\">vendas · 150 linhas · 13 cols<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-sm\" onclick=\"loadSample('normal')\">normal · 150 · 2 cols<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-sm\" onclick=\"loadSample('skew')\">log-normal · 150 · 2 cols<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-sm\" onclick=\"loadSample('corr')\">correlação · 150 · 3 cols<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 40px;\">\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">?<\u002Fdiv><div class=\"block-head-title\">Sobre o Data Lab<\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\" style=\"font-size: 0.85rem; line-height: 1.6; color: var(--text-body);\">\n              <p>Dashboard completo para exploração estatística. Navegue pelas seções na sidebar para:<\u002Fp>\n              <ul style=\"margin: 12px 0 0 24px; color: var(--text-muted);\">\n                <li><b style=\"color:var(--accent)\">Preview<\u002Fb> — veja suas linhas e aplique filtros antes da análise<\u002Fli>\n                <li><b style=\"color:var(--accent)\">Descritiva<\u002Fb> — 19 estatísticas + percentis + outliers + top/bottom 5<\u002Fli>\n                <li><b style=\"color:var(--accent)\">Probabilidade<\u002Fb> — calculadora P(X≤x), P(X≥x), P(a≤X≤b)<\u002Fli>\n                <li><b style=\"color:var(--accent)\">Testes<\u002Fb> — Shapiro-Wilk, ANOVA, Kruskal-Wallis, Qui²<\u002Fli>\n                <li><b style=\"color:var(--accent)\">Visualizações<\u002Fb> — histograma+KDE, boxplot, violin, Q-Q, ECDF, scatter, regressão<\u002Fli>\n                <li><b style=\"color:var(--accent)\">Correlações<\u002Fb> — matriz Pearson com código de cor<\u002Fli>\n                <li><b style=\"color:var(--accent)\">K-Means<\u002Fb> — clustering com detecção de cotovelo e visualização via PCA<\u002Fli>\n                <li><b style=\"color:var(--accent)\">PCA/SVD<\u002Fb> — scree plot + loadings + variância acumulada<\u002Fli>\n              <\u002Ful>\n              <p style=\"margin-top: 12px; color: var(--text-muted); font-size: 0.78rem;\">Atalho: <kbd style=\"font-family:var(--font-mono);background:var(--accent-faint);padding:2px 6px;border-radius:3px;color:var(--accent)\">Ctrl+K<\u002Fkbd> abre a paleta de comandos. Atalhos vim: <kbd style=\"font-family:var(--font-mono);background:var(--accent-faint);padding:2px 6px;border-radius:3px;color:var(--accent)\">g+s<\u002Fkbd> vai para Stats, <kbd style=\"font-family:var(--font-mono);background:var(--accent-faint);padding:2px 6px;border-radius:3px;color:var(--accent)\">g+v<\u002Fkbd> para Visualizações etc.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ PREVIEW ═════ -->\n      <section id=\"page-preview\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 01 · preview<\u002Fdiv>\n            <h1 class=\"page-head-title\">Preview dos Dados<\u002Fh1>\n            <div class=\"page-head-sub\">Explore suas linhas e colunas. Aplique filtros para restringir a análise.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"page-head-right\" id=\"previewMeta\">—<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">▼<\u002Fdiv><div class=\"block-head-title\">Aplicar filtro<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\" style=\"grid-template-columns: 2fr 1fr 2fr auto; gap: 10px; margin-bottom:0;\">\n              <div class=\"form-group\"><label>Coluna<\u002Flabel><select class=\"sel\" id=\"filterCol\"><\u002Fselect><\u002Fdiv>\n              <div class=\"form-group\"><label>Operador<\u002Flabel>\n                <select class=\"sel\" id=\"filterOp\">\n                  <option value=\"eq\">=<\u002Foption><option value=\"neq\">≠<\u002Foption>\n                  <option value=\"gt\">&gt;<\u002Foption><option value=\"lt\">&lt;<\u002Foption>\n                  <option value=\"contains\">contém<\u002Foption>\n                <\u002Fselect>\n              <\u002Fdiv>\n              <div class=\"form-group\"><label>Valor<\u002Flabel><input type=\"text\" class=\"txt\" id=\"filterVal\" placeholder=\"ex: B2B ou 1000\"><\u002Fdiv>\n              <div class=\"form-group\"><label>&nbsp;<\u002Flabel><button class=\"btn btn-primary\" onclick=\"applyNewFilter()\">aplicar<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"data-table-wrap\">\n          <div id=\"previewTblWrap\"><\u002Fdiv>\n          <div class=\"filter-bar\" id=\"filterBar\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ QUALITY ═════ -->\n      <section id=\"page-quality\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// Q · qualidade dos dados<\u002Fdiv>\n            <h1 class=\"page-head-title\">Qualidade &amp; Perfil<\u002Fh1>\n            <div class=\"page-head-sub\">Mapa de valores ausentes, duplicatas, cardinalidade, tipagem automática (datas e booleanos), tabelas de frequência e índices de concentração.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"page-head-right\" id=\"qualityHealth\">—<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Resumo -->\n        <div class=\"stat-grid\" id=\"qualityKpis\" style=\"margin-bottom: 18px;\"><\u002Fdiv>\n\n        <!-- Mapa de missing -->\n        <div class=\"block\">\n          <div class=\"block-head\">\n            <div class=\"block-head-icon\">▢<\u002Fdiv>\n            <div class=\"block-head-title\">Mapa de valores ausentes<\u002Fdiv>\n            <div class=\"block-head-meta\" id=\"missingMeta\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"block-body\">\n            <div id=\"missingMap\"><\u002Fdiv>\n            <div class=\"expander\" style=\"margin-top:14px;\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como interpretar este mapa<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p>Cada barra representa o <b>% de células ausentes<\u002Fb> em uma coluna. Cores indicam severidade: <b style=\"color:var(--green)\">verde<\u002Fb> &lt;5% (saudável), <b style=\"color:var(--accent)\">amarelo<\u002Fb> 5–20% (atenção), <b style=\"color:var(--red)\">vermelho<\u002Fb> &gt;20% (crítico).<\u002Fp>\n                <p style=\"margin-top:8px;\">Mini-mapa abaixo de cada barra mostra <b>onde<\u002Fb> os ausentes ocorrem ao longo das linhas — clusters podem indicar problemas de coleta em períodos específicos.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Perfil de colunas -->\n        <div class=\"block\">\n          <div class=\"block-head\">\n            <div class=\"block-head-icon\">⌗<\u002Fdiv>\n            <div class=\"block-head-title\">Perfil de colunas<\u002Fdiv>\n            <div class=\"block-head-meta\">tipo · únicos · ausentes · cardinalidade<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"block-body\">\n            <div id=\"qualityProfile\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Duplicatas -->\n        <div class=\"block\">\n          <div class=\"block-head\">\n            <div class=\"block-head-icon\">⎘<\u002Fdiv>\n            <div class=\"block-head-title\">Duplicatas<\u002Fdiv>\n            <div class=\"block-head-meta\" id=\"dupMeta\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\" style=\"margin-bottom: 10px;\">\n              <div class=\"form-group\">\n                <label>Considerar duplicata em base nas colunas<\u002Flabel>\n                <select class=\"sel\" id=\"dupCols\" multiple=\"\" style=\"min-height: 100px;\"><\u002Fselect>\n              <\u002Fdiv>\n              <div class=\"form-group\">\n                <label>&nbsp;<\u002Flabel>\n                <button class=\"btn btn-primary\" onclick=\"runDuplicates()\">▸ Detectar<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"dupResult\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Tabela de frequências -->\n        <div class=\"block\">\n          <div class=\"block-head\">\n            <div class=\"block-head-icon\">≡<\u002Fdiv>\n            <div class=\"block-head-title\">Tabela de frequências (categórica)<\u002Fdiv>\n            <div class=\"block-head-meta\">moda · gini · entropia<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\">\n              <div class=\"form-group\">\n                <label>Coluna categórica<\u002Flabel>\n                <select class=\"sel\" id=\"freqCol\" onchange=\"renderFrequencyTable()\"><\u002Fselect>\n              <\u002Fdiv>\n              <div class=\"form-group\">\n                <label>Top N<\u002Flabel>\n                <select class=\"sel\" id=\"freqTopN\" onchange=\"renderFrequencyTable()\">\n                  <option value=\"10\">10<\u002Foption>\n                  <option value=\"20\" selected=\"\">20<\u002Foption>\n                  <option value=\"50\">50<\u002Foption>\n                  <option value=\"9999\">tudo<\u002Foption>\n                <\u002Fselect>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"stat-grid\" id=\"freqKpis\" style=\"grid-template-columns: repeat(4, 1fr); margin-bottom: 16px;\"><\u002Fdiv>\n            <div id=\"freqTable\"><\u002Fdiv>\n            <div class=\"expander\" style=\"margin-top:14px;\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">o que é gini e entropia normalizada?<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p><b>Coeficiente de Gini:<\u002Fb> mede a concentração da distribuição. <b>0<\u002Fb> = perfeitamente uniforme (todos os valores aparecem igualmente), <b>1<\u002Fb> = totalmente concentrado (um valor domina). Valores próximos de 0.7+ indicam alta concentração.<\u002Fp>\n                <p style=\"margin-top:8px;\"><b>Entropia normalizada (0–1):<\u002Fb> quão \"diversa\" é a distribuição. <b>1<\u002Fb> = máxima diversidade, <b>0<\u002Fb> = um único valor. É o complemento perceptivo do Gini.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fsection>\n\n      <!-- ═════ STATS ═════ -->\n      <section id=\"page-stats\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 02 · descritiva<\u002Fdiv>\n            <h1 class=\"page-head-title\">Estatísticas Descritivas<\u002Fh1>\n            <div class=\"page-head-sub\">Medidas de tendência central, dispersão, forma e posição para uma coluna numérica.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"form-grid\">\n          <div class=\"form-group\"><label>Coluna numérica<\u002Flabel><select class=\"sel\" id=\"statsCol\" onchange=\"renderStats()\"><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"stat-grid\" id=\"statsGrid\"><\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">✦<\u002Fdiv><div class=\"block-head-title\">Insights automáticos<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"insight-list\" id=\"statsInsights\"><\u002Fdiv>\n            <div class=\"expander\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como interpretar estes valores<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p><b>Média vs mediana:<\u002Fb> se forem muito diferentes, há assimetria ou outliers. A mediana é mais robusta.<\u002Fp>\n                <p style=\"margin-top:8px;\"><b>Desvio padrão (σ):<\u002Fb> em média, o quanto os dados se afastam da média. ~68% dos valores caem em [μ−σ, μ+σ] se for normal.<\u002Fp>\n                <p style=\"margin-top:8px;\"><b>IQR:<\u002Fb> intervalo onde estão os 50% centrais dos dados (Q1 até Q3). Base para detectar outliers.<\u002Fp>\n                <p style=\"margin-top:8px;\"><b>CV%:<\u002Fb> dispersão relativa. &lt;15% homogêneo, 15–30% moderado, &gt;30% alto.<\u002Fp>\n                <p style=\"margin-top:8px;\"><b>Assimetria (skewness):<\u002Fb> 0 = simétrico, &gt;0 = cauda à direita, &lt;0 = à esquerda.<\u002Fp>\n                <p style=\"margin-top:8px;\"><b>Curtose:<\u002Fb> quão pesadas são as caudas vs. normal. 0 = normal, &gt;0 = leptocúrtica (caudas pesadas).<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">⟂<\u002Fdiv><div class=\"block-head-title\">Valores extremos<\u002Fdiv><div class=\"block-head-meta\">top 5 · bottom 5<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"extremes-grid\" id=\"extremesBox\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ PROBABILITY ═════ -->\n      <section id=\"page-probability\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 03 · probabilidade<\u002Fdiv>\n            <h1 class=\"page-head-title\">Distribuições &amp; Probabilidade<\u002Fh1>\n            <div class=\"page-head-sub\">Calcula probabilidades, quantis (inverso) e gera Q-Q plots para múltiplas distribuições — Normal, t-Student, χ², F, Exponencial, Poisson e Binomial.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"page-head-right\" id=\"probParams\">—<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Distribution selector + ajuste -->\n        <div class=\"block\">\n          <div class=\"block-head\">\n            <div class=\"block-head-icon\">∫<\u002Fdiv>\n            <div class=\"block-head-title\">Distribuição<\u002Fdiv>\n            <div class=\"block-head-meta\" id=\"probFitMeta\">selecione e ajuste parâmetros<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"tab-group\" id=\"distTabs\">\n              <button class=\"tab-btn active\" data-dist=\"normal\" onclick=\"setDistribution('normal', this)\">Normal<\u002Fbutton>\n              <button class=\"tab-btn\" data-dist=\"t\" onclick=\"setDistribution('t', this)\">t-Student<\u002Fbutton>\n              <button class=\"tab-btn\" data-dist=\"chi\" onclick=\"setDistribution('chi', this)\">χ²<\u002Fbutton>\n              <button class=\"tab-btn\" data-dist=\"f\" onclick=\"setDistribution('f', this)\">F<\u002Fbutton>\n              <button class=\"tab-btn\" data-dist=\"exp\" onclick=\"setDistribution('exp', this)\">Exponencial<\u002Fbutton>\n              <button class=\"tab-btn\" data-dist=\"poisson\" onclick=\"setDistribution('poisson', this)\">Poisson<\u002Fbutton>\n              <button class=\"tab-btn\" data-dist=\"binom\" onclick=\"setDistribution('binom', this)\">Binomial<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div class=\"form-grid\" style=\"grid-template-columns: 2fr 1fr 1fr 1fr; align-items: end; margin-top: 14px;\">\n              <div class=\"form-group\">\n                <label>Ajustar a partir de coluna numérica<\u002Flabel>\n                <select class=\"sel\" id=\"probCol\" onchange=\"fitFromColumn()\"><option value=\"\">— sem coluna (parâmetros manuais) —<\u002Foption><\u002Fselect>\n              <\u002Fdiv>\n              <div class=\"form-group\" id=\"probParamWrap1\"><label data-pid=\"lbl1\">μ<\u002Flabel><input type=\"number\" class=\"txt\" id=\"probParam1\" step=\"any\" oninput=\"renderProbability()\"><\u002Fdiv>\n              <div class=\"form-group\" id=\"probParamWrap2\"><label data-pid=\"lbl2\">σ<\u002Flabel><input type=\"number\" class=\"txt\" id=\"probParam2\" step=\"any\" oninput=\"renderProbability()\"><\u002Fdiv>\n              <div class=\"form-group\" id=\"probParamWrap3\" style=\"display:none\"><label data-pid=\"lbl3\">—<\u002Flabel><input type=\"number\" class=\"txt\" id=\"probParam3\" step=\"any\" oninput=\"renderProbability()\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Calculator -->\n        <div class=\"block\">\n          <div class=\"block-head\">\n            <div class=\"block-head-icon\">∑<\u002Fdiv>\n            <div class=\"block-head-title\">Calculadora<\u002Fdiv>\n            <div class=\"block-head-meta\" id=\"probModeMeta\">probabilidades &amp; quantis<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"tab-group\" id=\"probTabs\">\n              <button class=\"tab-btn active\" onclick=\"setProbMode('le', this)\" data-mode=\"le\">P(X ≤ x)<\u002Fbutton>\n              <button class=\"tab-btn\" onclick=\"setProbMode('ge', this)\" data-mode=\"ge\">P(X ≥ x)<\u002Fbutton>\n              <button class=\"tab-btn\" onclick=\"setProbMode('between', this)\" data-mode=\"between\">P(a ≤ X ≤ b)<\u002Fbutton>\n              <button class=\"tab-btn\" onclick=\"setProbMode('eq', this)\" data-mode=\"eq\" style=\"display:none\">P(X = k)<\u002Fbutton>\n              <button class=\"tab-btn\" onclick=\"setProbMode('inv', this)\" data-mode=\"inv\">Inverso · x | P<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"form-grid\" style=\"grid-template-columns: 1fr 1fr;\">\n              <div class=\"form-group\"><label id=\"probInputAlbl\">x (ou a)<\u002Flabel><input type=\"number\" class=\"txt\" id=\"probInputA\" step=\"any\" oninput=\"calcProb()\" placeholder=\"x\"><\u002Fdiv>\n              <div class=\"form-group\"><label id=\"probInputBlbl\">b (intervalo)<\u002Flabel><input type=\"number\" class=\"txt\" id=\"probInputB\" step=\"any\" oninput=\"calcProb()\" placeholder=\"b\" style=\"display:none\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"calc-output\" id=\"probOutput\"><\u002Fdiv>\n            <div id=\"probWarn\" style=\"margin-top: 14px;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- PDF/PMF curve + Q-Q -->\n        <div class=\"block\">\n          <div class=\"block-head\">\n            <div class=\"block-head-icon\">~<\u002Fdiv>\n            <div class=\"block-head-title\">Função densidade &amp; Q-Q plot<\u002Fdiv>\n            <div class=\"block-head-meta\">visualização da distribuição teórica vs. dados<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\" style=\"grid-template-columns: 1fr 1fr; gap: 16px;\">\n              <div>\n                <div class=\"stat-card-label\" style=\"margin-bottom: 8px;\">PDF / PMF teórica<\u002Fdiv>\n                <div class=\"chart-wrap\" style=\"height: 240px\"><canvas id=\"distChart\"><\u002Fcanvas><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div class=\"stat-card-label\" style=\"margin-bottom: 8px;\">Q-Q plot (dados × distribuição escolhida)<\u002Fdiv>\n                <div class=\"chart-wrap\" style=\"height: 240px\"><canvas id=\"distQQChart\"><\u002Fcanvas><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"expander\" style=\"margin-top: 14px;\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como interpretar Q-Q plot e probabilidades<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p><b>Q-Q plot:<\u002Fb> compara quantis dos seus dados (eixo Y) com quantis teóricos da distribuição selecionada (eixo X). Se os pontos se alinham na diagonal, a distribuição é uma boa aproximação.<\u002Fp>\n                <p style=\"margin-top:8px;\"><b>Desvios na cauda direita<\u002Fb> sugerem cauda mais pesada que o esperado; na esquerda, dados mais concentrados próximos à média.<\u002Fp>\n                <p style=\"margin-top:8px;\"><b>Inverso (quantil):<\u002Fb> dado uma probabilidade P, retorna o valor x tal que P(X ≤ x) = P. Útil para definir limites (ex: percentil 95%).<\u002Fp>\n                <p style=\"margin-top:8px;\"><b>Discretas (Poisson, Binomial):<\u002Fb> usam P(X = k) ao invés de PDF — exibimos como barras.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ TESTS ═════ -->\n      <section id=\"page-tests\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 04 · testes<\u002Fdiv>\n            <h1 class=\"page-head-title\">Testes Estatísticos<\u002Fh1>\n            <div class=\"page-head-sub\">Normalidade, comparação de grupos e independência entre variáveis categóricas.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">N<\u002Fdiv><div class=\"block-head-title\">Teste de Normalidade<\u002Fdiv><div class=\"block-head-meta\">Shapiro-Wilk<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\" style=\"margin-bottom: 16px;\">\n              <div class=\"form-group\"><label>Coluna<\u002Flabel><select class=\"sel\" id=\"testCol\" onchange=\"runNormality()\"><\u002Fselect><\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"normalityOut\"><\u002Fdiv>\n            <div class=\"expander\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como interpretar estes resultados<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p><b>H₀ (hipótese nula):<\u002Fb> os dados <b>são<\u002Fb> normais. <b>H₁:<\u002Fb> não são.<\u002Fp>\n                <p style=\"margin-top:6px;\">Se <b>p &gt; 0.05<\u002Fb> → não rejeitamos H₀ → compatível com normal.<\u002Fp>\n                <p style=\"margin-top:6px;\">Se <b>p ≤ 0.05<\u002Fb> → rejeitamos H₀ → não é normal. Use testes não-paramétricos (Kruskal-Wallis, Mann-Whitney etc.).<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">A<\u002Fdiv><div class=\"block-head-title\">ANOVA / Kruskal-Wallis<\u002Fdiv><div class=\"block-head-meta\">comparar grupos<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\">\n              <div class=\"form-group\"><label>Variável numérica<\u002Flabel><select class=\"sel\" id=\"anovaVal\" onchange=\"runANOVA()\"><\u002Fselect><\u002Fdiv>\n              <div class=\"form-group\"><label>Grupo (categórica)<\u002Flabel><select class=\"sel\" id=\"anovaGrp\" onchange=\"runANOVA()\"><\u002Fselect><\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"anovaOut\"><\u002Fdiv>\n            <div class=\"expander\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como interpretar estes resultados<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p><b>ANOVA:<\u002Fb> teste paramétrico — requer normalidade e homogeneidade de variâncias.<\u002Fp>\n                <p style=\"margin-top:6px;\"><b>Kruskal-Wallis:<\u002Fb> versão não-paramétrica (ranks), robusto a desvios de normalidade.<\u002Fp>\n                <p style=\"margin-top:6px;\">Se <b>p &lt; 0.05<\u002Fb> em algum deles, há <b>diferença significativa<\u002Fb> entre pelo menos dois grupos.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">χ<\u002Fdiv><div class=\"block-head-title\">Qui-Quadrado · Independência<\u002Fdiv><div class=\"block-head-meta\">2 categóricas<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\">\n              <div class=\"form-group\"><label>Categórica A<\u002Flabel><select class=\"sel\" id=\"chiA\" onchange=\"runChi()\"><\u002Fselect><\u002Fdiv>\n              <div class=\"form-group\"><label>Categórica B<\u002Flabel><select class=\"sel\" id=\"chiB\" onchange=\"runChi()\"><\u002Fselect><\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"chiOut\"><\u002Fdiv>\n            <div class=\"expander\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como interpretar estes resultados<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p><b>H₀:<\u002Fb> as duas variáveis são <b>independentes<\u002Fb>.<\u002Fp>\n                <p style=\"margin-top:6px;\">Se <b>p &lt; 0.05<\u002Fb>, existe <b>associação<\u002Fb> estatisticamente significativa.<\u002Fp>\n                <p style=\"margin-top:6px;\"><b>V de Cramér:<\u002Fb> mede a força da associação. 0 = nenhuma, 1 = perfeita. &gt;0.3 é considerado relevante.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ VIZ ═════ -->\n      <section id=\"page-viz\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 05 · visualizações<\u002Fdiv>\n            <h1 class=\"page-head-title\">Visualizações<\u002Fh1>\n            <div class=\"page-head-sub\">Inspecione a forma da distribuição, outliers e relações entre pares.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"form-grid\">\n          <div class=\"form-group\"><label>Coluna principal<\u002Flabel><select class=\"sel\" id=\"vizColX\" onchange=\"renderViz()\"><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"tab-group\" id=\"vizTabs\">\n          <button class=\"tab-btn active\" data-panel=\"histogram\" onclick=\"switchVizPanel('histogram')\">Histograma + KDE<\u002Fbutton>\n          <button class=\"tab-btn\" data-panel=\"boxplot\" onclick=\"switchVizPanel('boxplot')\">Box Plot<\u002Fbutton>\n          <button class=\"tab-btn\" data-panel=\"violin\" onclick=\"switchVizPanel('violin')\">Violin<\u002Fbutton>\n          <button class=\"tab-btn\" data-panel=\"qq\" onclick=\"switchVizPanel('qq')\">Q-Q Plot<\u002Fbutton>\n          <button class=\"tab-btn\" data-panel=\"ecdf\" onclick=\"switchVizPanel('ecdf')\">ECDF<\u002Fbutton>\n          <button class=\"tab-btn\" data-panel=\"scatter\" onclick=\"switchVizPanel('scatter')\">Scatter / Outliers<\u002Fbutton>\n          <button class=\"tab-btn\" data-panel=\"regression\" onclick=\"switchVizPanel('regression')\">Scatter + Regressão<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div id=\"vizPanel-histogram\" class=\"viz-panel active\">\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">▌<\u002Fdiv><div class=\"block-head-title\">Histograma + KDE<\u002Fdiv><div class=\"block-head-meta\" id=\"histMeta\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\">\n              <div class=\"slider-row\">\n                <span>bins:<\u002Fspan>\n                <input type=\"range\" id=\"binsSlider\" min=\"5\" max=\"60\" value=\"30\" oninput=\"renderHistogram()\">\n                <span class=\"val\" id=\"binsVal\">30<\u002Fspan>\n                <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartHist','histograma')\">↓ PNG<\u002Fbutton>\n              <\u002Fdiv>\n              <div class=\"chart-wrap\"><canvas id=\"chartHist\"><\u002Fcanvas><\u002Fdiv>\n              <div class=\"expander\">\n                <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como ler este gráfico<\u002Fdiv>\n                <div class=\"expander-body\">\n                  <p>Cada barra mostra quantos valores caem num intervalo (bin). A linha turquesa é a <b>KDE<\u002Fb> — estimativa suave da densidade, independente do número de bins. Um pico único sugere unimodal; múltiplos picos sugerem subpopulações.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"vizPanel-boxplot\" class=\"viz-panel\" style=\"display:none\">\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">▣<\u002Fdiv><div class=\"block-head-title\">Box Plot<\u002Fdiv><div class=\"block-head-meta\" id=\"boxMeta\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\">\n              <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartBox','boxplot')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n              <div class=\"chart-wrap short\"><canvas id=\"chartBox\"><\u002Fcanvas><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"vizPanel-violin\" class=\"viz-panel\" style=\"display:none\">\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">◈<\u002Fdiv><div class=\"block-head-title\">Violin Plot<\u002Fdiv><div class=\"block-head-meta\">densidade simétrica<\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\">\n              <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartViolin','violin')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n              <div class=\"chart-wrap\"><canvas id=\"chartViolin\"><\u002Fcanvas><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"vizPanel-qq\" class=\"viz-panel\" style=\"display:none\">\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">Q<\u002Fdiv><div class=\"block-head-title\">Q-Q Plot<\u002Fdiv><div class=\"block-head-meta\">observados vs normal<\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\">\n              <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartQQ','qq-plot')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n              <div class=\"chart-wrap\"><canvas id=\"chartQQ\"><\u002Fcanvas><\u002Fdiv>\n              <div class=\"expander\">\n                <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como ler este gráfico<\u002Fdiv>\n                <div class=\"expander-body\">\n                  <p>Se os pontos seguem a linha vermelha, os dados são consistentes com uma normal. Curvaturas nas extremidades indicam caudas mais pesadas/leves que a normal.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"vizPanel-ecdf\" class=\"viz-panel\" style=\"display:none\">\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">E<\u002Fdiv><div class=\"block-head-title\">Função de Distribuição Empírica (ECDF)<\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\">\n              <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartECDF','ecdf')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n              <div class=\"chart-wrap\"><canvas id=\"chartECDF\"><\u002Fcanvas><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"vizPanel-scatter\" class=\"viz-panel\" style=\"display:none\">\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">·:·<\u002Fdiv><div class=\"block-head-title\">Scatter / Outliers<\u002Fdiv><div class=\"block-head-meta\" id=\"scatterMeta\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\">\n              <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartScatter','scatter')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n              <div class=\"chart-wrap\"><canvas id=\"chartScatter\"><\u002Fcanvas><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"vizPanel-regression\" class=\"viz-panel\" style=\"display:none\">\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">y=<\u002Fdiv><div class=\"block-head-title\">Scatter + Regressão Linear<\u002Fdiv><div class=\"block-head-meta\" id=\"regMeta\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\">\n              <div class=\"form-grid\">\n                <div class=\"form-group\"><label>Eixo X<\u002Flabel><select class=\"sel\" id=\"regX\" onchange=\"renderRegression()\"><\u002Fselect><\u002Fdiv>\n                <div class=\"form-group\"><label>Eixo Y<\u002Flabel><select class=\"sel\" id=\"regY\" onchange=\"renderRegression()\"><\u002Fselect><\u002Fdiv>\n              <\u002Fdiv>\n              <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartReg','regressao')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n              <div class=\"chart-wrap\"><canvas id=\"chartReg\"><\u002Fcanvas><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ COMPARE ═════ -->\n      <section id=\"page-compare\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 06 · comparação<\u002Fdiv>\n            <h1 class=\"page-head-title\">Comparar 2 Colunas<\u002Fh1>\n            <div class=\"page-head-sub\">Métricas lado a lado, diferença de médias e correlação de Pearson.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"form-grid\">\n          <div class=\"form-group\"><label>Coluna A<\u002Flabel><select class=\"sel\" id=\"compCol1\" onchange=\"renderCompare()\"><\u002Fselect><\u002Fdiv>\n          <div class=\"form-group\"><label>Coluna B<\u002Flabel><select class=\"sel\" id=\"compCol2\" onchange=\"renderCompare()\"><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">⇌<\u002Fdiv><div class=\"block-head-title\">Comparação entre colunas<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div id=\"compTable\"><\u002Fdiv>\n            <div class=\"comp-kpi-row\" id=\"compKPI\"><\u002Fdiv>\n            <div class=\"expander\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como interpretar estes resultados<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p><b>Δμ:<\u002Fb> quanto a média da coluna B difere da coluna A (em valor absoluto e %).<\u002Fp>\n                <p style=\"margin-top:6px;\"><b>r de Pearson:<\u002Fb> correlação linear. |r| &lt; 0.2 muito fraca, 0.2–0.4 fraca, 0.4–0.6 moderada, 0.6–0.8 forte, &gt;0.8 muito forte.<\u002Fp>\n                <p style=\"margin-top:6px;\"><b>CV%:<\u002Fb> coluna com CV maior é mais dispersa em relação à sua média.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ CORRELATIONS ═════ -->\n      <section id=\"page-correlations\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 07 · correlações<\u002Fdiv>\n            <h1 class=\"page-head-title\">Matriz de Correlação<\u002Fh1>\n            <div class=\"page-head-sub\">Correlação de Pearson entre todas as colunas numéricas selecionadas.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"form-grid\">\n          <div class=\"form-group\" style=\"grid-column: 1 / -1;\">\n            <label>Colunas numéricas · Ctrl/Cmd para múltiplas<\u002Flabel>\n            <select class=\"sel\" id=\"corrCols\" multiple=\"\" onchange=\"renderCorrelations()\"><\u002Fselect>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">M<\u002Fdiv><div class=\"block-head-title\">Matriz<\u002Fdiv><div class=\"block-head-meta\">laranja = +, vermelho = −<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div id=\"corrMatrix\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">✦<\u002Fdiv><div class=\"block-head-title\">Top 5 correlações (por magnitude)<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\"><div class=\"insight-list\" id=\"corrInsights\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ K-MEANS ═════ -->\n      <section id=\"page-kmeans\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 08 · clustering<\u002Fdiv>\n            <h1 class=\"page-head-title\">K-Means<\u002Fh1>\n            <div class=\"page-head-sub\">Clusterização não-supervisionada com detecção automática de cotovelo.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"form-grid\">\n          <div class=\"form-group\" style=\"grid-column: 1 / -1;\">\n            <label>Colunas numéricas · Ctrl/Cmd para múltiplas (≥2)<\u002Flabel>\n            <select class=\"sel\" id=\"kmCols\" multiple=\"\"><\u002Fselect>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-body\">\n            <div class=\"slider-row\">\n              <span>K = <\u002Fspan>\n              <input type=\"range\" id=\"kSlider\" min=\"2\" max=\"8\" value=\"3\" oninput=\"document.getElementById('kVal').textContent = this.value\">\n              <span class=\"val\" id=\"kVal\">3<\u002Fspan>\n              <button class=\"btn btn-primary\" onclick=\"runKMeans()\">⚡ clusterizar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"chart-row\">\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">K<\u002Fdiv><div class=\"block-head-title\">Gráfico do Cotovelo<\u002Fdiv><div class=\"block-head-meta\" id=\"elbowDetected\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\"><div class=\"chart-wrap short\"><canvas id=\"chartElbow\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"block\">\n            <div class=\"block-head\"><div class=\"block-head-icon\">⊙<\u002Fdiv><div class=\"block-head-title\">Scatter PCA com Clusters<\u002Fdiv><\u002Fdiv>\n            <div class=\"block-body\"><div class=\"chart-wrap short\"><canvas id=\"chartPCAScatter\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">C<\u002Fdiv><div class=\"block-head-title\">Centróides (escala original)<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\"><div id=\"kmCentroids\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ PCA ═════ -->\n      <section id=\"page-pca\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// 09 · redução<\u002Fdiv>\n            <h1 class=\"page-head-title\">PCA / SVD<\u002Fh1>\n            <div class=\"page-head-sub\">Decomposição em componentes principais + variância explicada.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"form-grid\">\n          <div class=\"form-group\" style=\"grid-column: 1 / -1;\">\n            <label>Colunas numéricas · Ctrl/Cmd para múltiplas (≥2)<\u002Flabel>\n            <select class=\"sel\" id=\"pcaCols\" multiple=\"\"><\u002Fselect>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"actions\" style=\"margin-bottom: 16px;\">\n          <button class=\"btn btn-primary\" onclick=\"runPCA()\">⚡ decompor<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">Σ<\u002Fdiv><div class=\"block-head-title\">Componentes<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\"><div id=\"pcaTable\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">▌<\u002Fdiv><div class=\"block-head-title\">Scree Plot · Variância Explicada<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\"><div class=\"chart-wrap short\"><canvas id=\"chartScree\"><\u002Fcanvas><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">L<\u002Fdiv><div class=\"block-head-title\">Loadings · peso de cada variável<\u002Fdiv><div class=\"block-head-meta\">|valor| &gt; 0.5 é relevante<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\"><div id=\"pcaLoadings\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ MULTIPLE REGRESSION ═════ -->\n      <section id=\"page-mreg\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// M · regressão múltipla<\u002Fdiv>\n            <h1 class=\"page-head-title\">Regressão Linear Múltipla<\u002Fh1>\n            <div class=\"page-head-sub\">OLS com várias variáveis explicativas. Coeficientes, t-stat, p-valor, R² ajustado, F-test e diagnóstico de resíduos.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">y=<\u002Fdiv><div class=\"block-head-title\">Especificação do modelo<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\">\n              <div class=\"form-group\"><label>Variável dependente (Y)<\u002Flabel><select class=\"sel\" id=\"mregY\" onchange=\"runMReg()\"><\u002Fselect><\u002Fdiv>\n              <div class=\"form-group\"><label>Variáveis explicativas (X) — Ctrl/Cmd para múltiplas<\u002Flabel><select class=\"sel\" id=\"mregX\" multiple=\"\" size=\"6\" onchange=\"runMReg()\"><\u002Fselect><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">Σ<\u002Fdiv><div class=\"block-head-title\">Resumo do ajuste<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\"><div id=\"mregSummary\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">β<\u002Fdiv><div class=\"block-head-title\">Coeficientes<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\"><div id=\"mregCoef\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">◦<\u002Fdiv><div class=\"block-head-title\">Predito vs Observado<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartMRegPred','predito-vs-observado')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n            <div class=\"chart-wrap\"><canvas id=\"chartMRegPred\"><\u002Fcanvas><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">~<\u002Fdiv><div class=\"block-head-title\">Resíduos vs Predito<\u002Fdiv><div class=\"block-head-meta\">teste de homoscedasticidade visual<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartMRegRes','residuos')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n            <div class=\"chart-wrap\"><canvas id=\"chartMRegRes\"><\u002Fcanvas><\u002Fdiv>\n            <div class=\"expander\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como interpretar<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p>Resíduos devem distribuir-se aleatoriamente em torno de 0, sem padrão. Funil (variância crescente) sugere <b>heterocedasticidade<\u002Fb>; curva sistemática sugere <b>não-linearidade<\u002Fb>.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ CONTINGENCY ═════ -->\n      <section id=\"page-contingency\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// × · contingência<\u002Fdiv>\n            <h1 class=\"page-head-title\">Tabelas de Contingência<\u002Fh1>\n            <div class=\"page-head-sub\">Cross-tab de duas variáveis categóricas com contagens, % por linha/coluna, frequências esperadas, resíduos padronizados e qui-quadrado.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">⊞<\u002Fdiv><div class=\"block-head-title\">Variáveis<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\" style=\"grid-template-columns: 1fr 1fr 1fr;\">\n              <div class=\"form-group\"><label>Linhas<\u002Flabel><select class=\"sel\" id=\"ctgA\" onchange=\"renderContingency()\"><\u002Fselect><\u002Fdiv>\n              <div class=\"form-group\"><label>Colunas<\u002Flabel><select class=\"sel\" id=\"ctgB\" onchange=\"renderContingency()\"><\u002Fselect><\u002Fdiv>\n              <div class=\"form-group\"><label>Visualização<\u002Flabel>\n                <select class=\"sel\" id=\"ctgMode\" onchange=\"renderContingency()\">\n                  <option value=\"count\">Contagens (n)<\u002Foption>\n                  <option value=\"row\">% por linha<\u002Foption>\n                  <option value=\"col\">% por coluna<\u002Foption>\n                  <option value=\"exp\">Esperados (sob H₀)<\u002Foption>\n                  <option value=\"res\">Resíduos padronizados<\u002Foption>\n                <\u002Fselect>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">χ²<\u002Fdiv><div class=\"block-head-title\">Teste de independência<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\"><div id=\"ctgStats\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">▦<\u002Fdiv><div class=\"block-head-title\">Tabela (heatmap)<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\"><div id=\"ctgTable\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">█<\u002Fdiv><div class=\"block-head-title\">Stacked bars (% por linha)<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartCtg','contingencia')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n            <div class=\"chart-wrap\"><canvas id=\"chartCtg\"><\u002Fcanvas><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ═════ TIME SERIES ═════ -->\n      <section id=\"page-time\" class=\"page\">\n        <div class=\"page-head\">\n          <div>\n            <div class=\"page-head-meta\">// T · temporal<\u002Fdiv>\n            <h1 class=\"page-head-title\">Séries Temporais<\u002Fh1>\n            <div class=\"page-head-sub\">Linha temporal, médias móveis, EWMA, decomposição clássica (tendência + sazonalidade + resíduo) e autocorrelação ACF/PACF.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">⏱<\u002Fdiv><div class=\"block-head-title\">Série<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"form-grid\" style=\"grid-template-columns: 1fr 1fr 1fr 1fr;\">\n              <div class=\"form-group\"><label>Coluna de data<\u002Flabel><select class=\"sel\" id=\"tsDate\" onchange=\"renderTime()\"><\u002Fselect><\u002Fdiv>\n              <div class=\"form-group\"><label>Valor (numérico)<\u002Flabel><select class=\"sel\" id=\"tsVal\" onchange=\"renderTime()\"><\u002Fselect><\u002Fdiv>\n              <div class=\"form-group\"><label>Janela MA<\u002Flabel><input type=\"number\" class=\"sel\" id=\"tsMA\" value=\"7\" min=\"2\" max=\"365\" onchange=\"renderTime()\"><\u002Fdiv>\n              <div class=\"form-group\"><label>α EWMA<\u002Flabel><input type=\"number\" class=\"sel\" id=\"tsAlpha\" value=\"0.3\" step=\"0.05\" min=\"0.05\" max=\"0.95\" onchange=\"renderTime()\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">~<\u002Fdiv><div class=\"block-head-title\">Série + MA + EWMA<\u002Fdiv><div class=\"block-head-meta\" id=\"tsMeta\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartTS','serie')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n            <div class=\"chart-wrap\"><canvas id=\"chartTS\"><\u002Fcanvas><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">▤<\u002Fdiv><div class=\"block-head-title\">Decomposição (período = janela MA)<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <div class=\"chart-wrap short\"><canvas id=\"chartTSTrend\"><\u002Fcanvas><\u002Fdiv>\n            <div class=\"chart-wrap short\"><canvas id=\"chartTSSeas\"><\u002Fcanvas><\u002Fdiv>\n            <div class=\"chart-wrap short\"><canvas id=\"chartTSRes\"><\u002Fcanvas><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">⌽<\u002Fdiv><div class=\"block-head-title\">ACF · Autocorrelação<\u002Fdiv><div class=\"block-head-meta\">lags 0–24<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartACF','acf')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n            <div class=\"chart-wrap short\"><canvas id=\"chartACF\"><\u002Fcanvas><\u002Fdiv>\n            <div class=\"expander\">\n              <div class=\"expander-head\" onclick=\"toggleExpander(this)\">como interpretar<\u002Fdiv>\n              <div class=\"expander-body\">\n                <p>Barras fora das linhas tracejadas (±1.96/√n) são <b>significantes<\u002Fb>. Decaimento lento → série não-estacionária. Picos em múltiplos de k → sazonalidade de período k.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"block\">\n          <div class=\"block-head\"><div class=\"block-head-icon\">⌾<\u002Fdiv><div class=\"block-head-title\">PACF · Autocorrelação Parcial<\u002Fdiv><\u002Fdiv>\n          <div class=\"block-body\">\n            <button class=\"btn btn-ghost btn-sm\" onclick=\"downloadPNG('chartPACF','pacf')\" style=\"margin-bottom:8px;\">↓ PNG<\u002Fbutton>\n            <div class=\"chart-wrap short\"><canvas id=\"chartPACF\"><\u002Fcanvas><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<!-- ═════ CMD PALETTE ═════ -->\n<div class=\"cmd-palette\" id=\"cmdPalette\">\n  <input type=\"text\" class=\"cmd-input\" id=\"cmdInput\" placeholder=\"Busque comandos ou seções...\" autocomplete=\"off\">\n  <div class=\"cmd-list\" id=\"cmdList\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═════ TWEAKS ═════ -->\n<div class=\"tweaks-panel\" id=\"tweaksPanel\">\n  <div class=\"tweaks-title\">\n    <span>// tweaks<\u002Fspan>\n    <button onclick=\"toggleTweaks()\">×<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"tweak-row\">\n    <span>Tema<\u002Fspan>\n    <div class=\"opts\">\n      <button class=\"tweak-opt active\" data-tweak-theme=\"amber\">amber<\u002Fbutton>\n      <button class=\"tweak-opt\" data-tweak-theme=\"matrix\">matrix<\u002Fbutton>\n      <button class=\"tweak-opt\" data-tweak-theme=\"neo\">neo<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tweak-row\">\n    <span>Rain code<\u002Fspan>\n    <button class=\"tweak-opt active\" id=\"tweakRain\">on/off<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═════ TOAST ═════ -->\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n\n<script src=\"e127f158-cd92-43cc-bcd2-a523c559c429\"><\u002Fscript>\n<script src=\"cca71070-31f5-4c02-b75e-06f7fd8b6e09\"><\u002Fscript>\n<script src=\"e064f3ba-3f15-4406-92fd-395ff41ff59e\"><\u002Fscript>\n<script src=\"050788b8-655c-4c2a-a79f-0e77745aa941\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
